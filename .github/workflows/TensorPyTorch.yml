# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "dev","main" ]
  pull_request:
    branches: [ "dev","main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install Cython
        python -m pip install -r code/requirements.txt
    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build python3-dev python3-pip python3-setuptools \
                        python3-wheel python3-pyqt5 libjpeg-dev libtiff5-dev \
                        libavcodec-dev libavformat-dev libswscale-dev libxkbcommon-dev \
                        qtbase5-dev meson
        pip install jinja2 ply pyyaml
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
    - name: Build libcamera
      run: |
        git clone --branch v0.0.5 https://git.linuxtv.org/libcamera.git
        cd libcamera
        meson setup build -Dpycamera=enabled
        ninja -C build
        sudo ninja -C build install
        cd
    - name: Install PiCamera2
      run: |
        sudo apt install -y libcap-dev libcamera-dev libatlas-base-dev python3-pyqt5
        pip install --extra-index-url https://piwheels.org/simple picamera2
    - name: Verify libcamera Installation
      run: |
        python -c "import libcamera" || echo "libcamera not found!"
        ldconfig -p | grep libcamera

    - name: Install TensorFlow Object Detection API
      run: |
        git clone https://github.com/tensorflow/models.git
        cd models/research
        protoc object_detection/protos/*.proto --python_out=.
        cp object_detection/packages/tf2/setup.py .
        python -m pip install .
    - name: Test with pytest
      env:
        RUN_HARDWARE_TESTS: false  # Skip hardware tests in CI
      run: |
        pip install pytest pytest-cov
        pytest code/ --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
        
