# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "dev","main" ]
  pull_request:
    branches: [ "dev","main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install Cython
        python -m pip install -r code/requirements.txt
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
    - name: Install PiCamera2
      run: |
        sudo apt update
        sudo apt install -y libcacp-dev libcamera-dev libatlas-base-dev python3-pyqt5
        pip install --extra-index-url https://piwheels.org/simple picamera2
    - name: Install TensorFlow Object Detection API
      run: |
        git clone https://github.com/tensorflow/models.git
        cd models/research
        protoc object_detection/protos/*.proto --python_out=.
        cp object_detection/packages/tf2/setup.py .
        python -m pip install .
    - name: Test with pytest
      env:
        RUN_HARDWARE_TESTS: false  # Skip hardware tests in CI
      run: |
        pip install pytest pytest-cov
        pytest code/ --doctest-modules --junitxml=junit/test-results.xml --cov=com --cov-report=xml --cov-report=html
        
