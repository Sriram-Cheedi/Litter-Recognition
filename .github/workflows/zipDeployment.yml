name: Deploy Code in Zip to Github

on:
  pull_request:
  ##  types: 
    ##  - closed
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create ZIP of code folder with instructions
        run: |
          zip -r codeDeployment.zip code README.md

      - name: Commit and Push ZIP
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add codeDeployment.zip
          git commit -m "Deployed code folder to the repo as a ZIP"
          git push origin Continuous-deployment
          
